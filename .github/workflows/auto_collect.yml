name: Auto Collect

on:
  workflow_dispatch:

jobs:
  auto-collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto collect
        run: python scripts/run_auto_collect.py

      # Future option:
      # - Upload data/latest_items.jsonl as an artifact, or commit a generated
      #   JSONL snapshot. Do not commit SQLite databases by default.

